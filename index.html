<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiuBai VI Manual</title><style>body{margin:0;font-family:Arial,sans-serif;background:#faf8f5;color:#071a57;display:grid;place-items:center;min-height:100vh}.loading{text-align:center}.dot{width:34px;height:34px;border:3px solid #dae1ef;border-top-color:#103fd5;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style><div class="loading"><div class="dot"></div>Loading LiuBai VI Manual…</div><script>(async()=>{let s='';for(let i=1;i<=15;i++){let n=String(i).padStart(2,'0');s+=await(await fetch('p'+n+'.txt')).text()}let bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));let ds=new DecompressionStream('gzip');let text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()})().catch(e=>{document.body.innerHTML='<div style="padding:24px">页面加载失败，请刷新重试。</div>'})</script>
