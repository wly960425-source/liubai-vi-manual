name: Import full VI manual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete published site
        run: |
          rm -rf _site
          mkdir _site
          cd _site
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent --no-host-directories https://piercing-bot-jbk432j.shipstatic.com/ || true
          test -f index.html
      - name: Replace repository site files
        run: |
          find . -maxdepth 1 -type f \( -name 'p*.txt' -o -name 'index.html' \) -delete
          cp -a _site/. .
          rm -rf _site
          touch .nojekyll
      - name: Commit imported full site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy complete mobile VI manual'
          git push
