name: Deploy full VI manual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download complete VI manual
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://piercing-bot-jbk432j.shipstatic.com'
          curl -fL "$BASE/" -o index.html
          for i in $(seq -w 1 15); do
            curl -fL "$BASE/p${i}.txt" -o "p${i}.txt"
          done
          touch .nojekyll
          test -s index.html
          for i in $(seq -w 1 15); do test -s "p${i}.txt"; done

      - name: Save complete site in repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html p*.txt .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Store complete VI manual site'
            git push
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _deploy
          mkdir _deploy
          cp index.html p*.txt .nojekyll _deploy/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
