name: Deploy HD VI manual to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare HD static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir _deploy
          unzip -q liubai-vi-manual-hd.zip -d _deploy
          touch _deploy/.nojekyll
          test -s _deploy/index.html
          test -d _deploy/assets
          test "$(find _deploy/assets -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 19
          echo "HD package ready: 19 original PNG assets"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
